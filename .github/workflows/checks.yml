# Every pull request: formatting, type-check and a full production build
# (content pull, client + SSR builds, prerender) — what Publish would run.
name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Format, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run build
